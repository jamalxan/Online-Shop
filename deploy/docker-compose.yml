# Production stack. Run from the stack directory on the server, which holds .env,
# the repository checkout (app/) and the data directories:
#
#   /srv/apexstore/
#     .env             secrets + SITE_URL (never committed)
#     app/             git checkout of this repository
#     media/           public uploads, served by nginx at /media/
#     static/          collectstatic output, served by nginx at /static/
#     private_media/   payment receipts — NOT served by nginx
#
#   docker compose --project-directory /srv/apexstore -f app/deploy/docker-compose.yml up -d
#
# Relative paths below resolve against the project directory, not this file.
name: apexstore

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # OTP codes and rate-limit counters only: nothing worth persisting to disk
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./media:/app/Media
      - ./private_media:/app/private_media
      - ./static:/app/staticfiles
    healthcheck:
      # Same request nginx makes: real Host header, already-HTTPS (otherwise Django redirects)
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request as u
          host = os.environ["ALLOWED_HOSTS"].split(",")[0].strip()
          req = u.Request("http://127.0.0.1:8000/api/health/", headers={"Host": host, "X-Forwarded-Proto": "https"})
          u.urlopen(req, timeout=5)
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${SITE_URL}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${SITE_URL}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3010:3000"

volumes:
  pgdata:
