# /etc/nginx/sites-available/apexstore  (symlinked into sites-enabled)
#
# One origin for everything, so the httpOnly refresh cookie is first-party:
#   /api/     -> Django (gunicorn, 127.0.0.1:8010)
#   /static/  -> collectstatic output
#   /media/   -> public uploads
#   /         -> Next.js (127.0.0.1:3010)
#
# This is the plain-HTTP starting point; `certbot --nginx -d <host> --redirect`
# adds the TLS listener and the HTTP->HTTPS redirect to the installed copy.
# private_media/ (payment receipts) is deliberately not exposed here.
server {
    listen 80;
    listen [::]:80;
    server_name 48-217-83-167.sslip.io;

    # Product images are capped at 5 MB each by Django; allow a multi-file form
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /srv/apexstore/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/apexstore/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
